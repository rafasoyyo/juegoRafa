# Despliegue de una preview en Firebase Hosting, un canal por rama de integración.
# Se lanza automáticamente con cada push o merge a dev, mundo1, mundo2, mundo3,
# mundo4 o mundo5 (y a mano). El canal se llama igual que la rama, su URL es
# fija y aparece en el resumen del job.
name: Despliegue de preview (Firebase)

on:
  push:
    branches: [dev, mundo1, mundo2, mundo3, mundo4, mundo5]
  workflow_dispatch:

# Un despliegue nuevo cancela el anterior de la misma rama, no el de otras.
concurrency:
  group: firebase-preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  preview:
    # A mano solo se publica desde una de las ramas de integración.
    if: contains(fromJSON('["dev","mundo1","mundo2","mundo3","mundo4","mundo5"]'), github.ref_name)
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar preview en Firebase Hosting
        id: firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: juegorafa-edu
          channelId: ${{ github.ref_name }}

      - name: URL de la preview
        run: echo "Preview de ${{ github.ref_name }} publicada en ${{ steps.firebase.outputs.details_url }}" >> "$GITHUB_STEP_SUMMARY"
