# Despliegue a producción en Firebase Hosting (proyecto juegorafa-edu).
# Se lanza con cada push a main o a mano desde la pestaña Actions.
name: Despliegue a producción (Firebase)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://juegorafa-edu.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Publicar en Firebase Hosting (canal live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: juegorafa-edu
          channelId: live
